name: Test report

# Renders the `test-results` artifact of a finished CI run as a check. A separate workflow_run so
# it can write checks for pull requests from forks and Dependabot, whose own token is read-only.
on:
  workflow_call:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test report
        uses: dorny/test-reporter@v3
        with:
          artifact: test-results
          name: Tests
          path: "**/tests.json"
          reporter: dart-json
          fail-on-error: false
