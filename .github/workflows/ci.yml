name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "bin/**"
      - "lib/**"
      - "test/**"
      - "example/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "dart_test.yaml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "bin/**"
      - "lib/**"
      - "test/**"
      - "example/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "dart_test.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # The recipe this repository publishes for the others, run against this commit.
    uses: ./.github/workflows/dart-package.yml
    with:
      test: false
