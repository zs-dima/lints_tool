# Inherited through `include:` — consumers do not repeat it (verified on Dart 3.13.4).
formatter:
      page_width: 120
      trailing_commas: preserve

analyzer:
      exclude:
            # Build
            - "build/**"
            # Tests
            - "test/**.mocks.dart"
            - ".test_coverage.dart"
            - "coverage/**"
            # Assets
            - "assets/**"
            # Generated
            - "lib/**/generated/**"
            - "**/*.freezed.dart"
            - "**/*.g.dart"
            - "**/*.gr.dart"
            - "**/*.gen.dart"
            - "**/*.gql.dart"
            - "**/*.config.dart"
            - "**/*.mocks.dart"
            - "**/*.pg.dart"
            - "**/*.pb.dart"
            - "**/*.pbenum.dart"
            - "**/*.pbjson.dart"
            - "**/*.pbgrpc.dart"
            - "**/*.connect.client.dart"
            - "**/*.connect.spec.dart"
            # Flutter Version Manager
            - ".fvm/**"
            # Tools
            #- "tool/**"
            - "scripts/**"
            - ".dart_tool/**"
            # Platform
            - "ios/**"
            - "android/**"
            - "web/**"
            - "macos/**"
            - "windows/**"
            - "linux/**"

      # Enable the following options to enable strong mode.
      language:
            strict-casts: true
            strict-raw-types: true
            strict-inference: true

      errors:
            # Allow having TODOs in the code
            todo: info

            # These four were silenced, and `strict_raw_type` is the ONLY diagnostic
            # `strict-raw-types: true` emits — so that flag did nothing at all. Un-ignoring all four
            # costs 6 findings across BreakerSonar (measured 2026-09-19), so the suppressions had
            # outlived whatever migration put them here.

            # Info
            directives_ordering: info
            always_declare_return_types: info

            # Warning
            missing_return: warning
            missing_required_param: warning
            no_logic_in_create_state: warning
            empty_catches: warning

            avoid_empty_else: warning
            avoid_type_to_string: warning
            empty_statements: warning
            hash_and_equals: warning
            collection_methods_unrelated_type: warning
            dangling_library_doc_comments: warning
            implicit_call_tearoffs: warning
            type_literal_in_constant_pattern: warning
            unnecessary_to_list_in_spreads: warning
            use_string_in_part_of_directives: warning
            use_super_parameters: warning

            # Error
            always_use_package_imports: error
            avoid_dynamic_calls: error
            avoid_relative_lib_imports: error
            avoid_slow_async_io: error
            avoid_types_as_parameter_names: error
            cancel_subscriptions: error
            close_sinks: error
            valid_regexps: error

            # Style Rules
            avoid_equals_and_hash_code_on_mutable_classes: error
            avoid_field_initializers_in_const_classes: warning
            avoid_function_literals_in_foreach_calls: warning
            avoid_returning_this: warning
            avoid_unused_constructor_parameters: warning
            avoid_void_async: error
            await_only_futures: warning
            cast_nullable_to_non_nullable: warning
            conditional_uri_does_not_exist: warning
            no_leading_underscores_for_local_identifiers: warning
            null_closures: error
            only_throw_errors: warning
            parameter_assignments: error
            prefer_asserts_with_message: warning
            prefer_const_constructors: error
            prefer_const_constructors_in_immutables: warning
            prefer_const_declarations: warning
            prefer_const_literals_to_create_immutables: warning
            prefer_expression_function_bodies: warning
            prefer_final_fields: error
            prefer_final_in_for_each: error
            prefer_final_locals: error
            prefer_function_declarations_over_variables: warning
            prefer_generic_function_type_aliases: warning
            prefer_initializing_formals: warning
            prefer_typing_uninitialized_variables: error
            provide_deprecation_message: warning
            recursive_getters: warning
            tighten_type_of_initializing_formals: warning
            type_annotate_public_apis: error
            unawaited_futures: warning
            # unnecessary_await_in_return is deliberately absent, not merely unlisted: it is the exact
        # inverse of `async_return_with_no_await` above. One asks for the `await`, the other asks
        # to remove it, and no code satisfies both.
            unnecessary_this: warning
            use_full_hex_values_for_flutter_colors: warning
            use_function_type_syntax_for_parameters: warning
            use_string_buffers: warning
            use_enums: warning

            # Pub Rules
            depend_on_referenced_packages: error
            secure_pubspec_urls: warning

linter:
      rules:
            # https://dart.dev/tools/linter-rules
            # Public packages
            public_member_api_docs: false
            lines_longer_than_80_chars: false

            # Enabling rules
            always_use_package_imports: true
            avoid_relative_lib_imports: true

            # Flutter
            flutter_style_todos: false
            use_key_in_widget_constructors: true
            sized_box_shrink_expand: true
            use_colored_box: true
            use_decorated_box: true

            # Disable rules
            sort_pub_dependencies: false
            prefer_relative_imports: false
            avoid_escaping_inner_quotes: false
            # Re-enabled 2026-09-19: errorProne, part of the flutter_lints baseline, and only 5 hits
            # in BreakerSonar. It allows a one-line `if (x) y();` and asks for braces only when the
            # body moves to its own line — which is the dangling-statement bug it exists to stop.
            curly_braces_in_flow_control_structures: true
            prefer_double_quotes: false
            prefer_foreach: false
            unnecessary_final: false
            always_specify_types: false
            avoid_redundant_argument_values: false
            always_put_control_body_on_new_line: false
            do_not_use_environment: false
            sort_constructors_first: false
            avoid_multiple_declarations_per_line: false
            always_put_required_named_parameters_first: false
            avoid_positional_boolean_parameters: false #
            require_trailing_commas: false #
            diagnostic_describe_all_properties: false #
            comment_references: false # Unused because https://github.com/dart-lang/sdk/issues/36974

            # Enabled
            avoid_web_libraries_in_flutter: true
            depend_on_referenced_packages: true
            use_named_constants: true
            unnecessary_constructor_name: true
            use_enums: true
            use_is_even_rather_than_modulo: true
            library_private_types_in_public_api: true
            tighten_type_of_initializing_formals: true
            exhaustive_cases: true
            sort_unnamed_constructors_first: true
            type_literal_in_constant_pattern: true
            avoid_annotating_with_dynamic: true
            avoid_bool_literals_in_conditional_expressions: true
            avoid_double_and_int_checks: true
            avoid_field_initializers_in_const_classes: true
            avoid_implementing_value_types: true
            avoid_js_rounded_ints: true
            avoid_print: true
            avoid_renaming_method_parameters: true
            avoid_returning_null_for_void: true
            avoid_single_cascade_in_expression_statements: true
            avoid_slow_async_io: true
            avoid_unnecessary_containers: true
            avoid_unused_constructor_parameters: true
            avoid_void_async: true
            await_only_futures: true
            cancel_subscriptions: true
            cascade_invocations: true
            close_sinks: true
            control_flow_in_finally: true
            empty_statements: true
            collection_methods_unrelated_type: true
            dangling_library_doc_comments: true
            implicit_call_tearoffs: true
            unnecessary_to_list_in_spreads: true
            use_string_in_part_of_directives: true
            use_super_parameters: true
            join_return_with_assignment: true
            leading_newlines_in_multiline_strings: true
            literal_only_boolean_expressions: true
            missing_whitespace_between_adjacent_strings: true
            no_adjacent_strings_in_list: true
            no_logic_in_create_state: true
            no_runtimeType_toString: true
            only_throw_errors: true
            overridden_fields: true
            package_names: true
            package_prefixed_library_names: true
            parameter_assignments: true
            prefer_asserts_in_initializer_lists: true
            prefer_asserts_with_message: true
            prefer_const_constructors: true
            prefer_const_constructors_in_immutables: true
            prefer_const_declarations: true
            prefer_const_literals_to_create_immutables: true
            prefer_constructors_over_static_methods: true
            prefer_expression_function_bodies: true
            prefer_final_in_for_each: true
            prefer_final_locals: true #
            prefer_if_elements_to_conditional_expressions: true
            prefer_inlined_adds: true
            prefer_int_literals: false
            prefer_is_not_operator: true
            prefer_null_aware_operators: true
            prefer_typing_uninitialized_variables: true
            prefer_void_to_null: true
            provide_deprecation_message: true
            sized_box_for_whitespace: true
            sort_child_properties_last: true
            test_types_in_equals: true
            throw_in_finally: true
            unnecessary_null_aware_assignments: true
            unnecessary_overrides: true
            unnecessary_parenthesis: true
            unnecessary_raw_strings: true
            unnecessary_statements: true
            unnecessary_string_escapes: true
            unnecessary_string_interpolations: true
            use_full_hex_values_for_flutter_colors: true
            use_raw_strings: true
            use_string_buffers: true
            valid_regexps: true
            void_checks: true

            # Pedantic 1.9.0
            always_declare_return_types: true
            annotate_overrides: true
            avoid_empty_else: true
            avoid_init_to_null: true
            avoid_return_types_on_setters: true
            avoid_shadowing_type_parameters: true
            avoid_types_as_parameter_names: true
            camel_case_extensions: true
            empty_catches: true
            empty_constructor_bodies: true
            library_names: true
            library_prefixes: true
            no_duplicate_case_values: true
            null_closures: true
            omit_local_variable_types: true
            prefer_adjacent_string_concatenation: true
            prefer_collection_literals: true
            prefer_conditional_assignment: true
            prefer_contains: true
            prefer_final_fields: true
            prefer_for_elements_to_map_fromIterable: true
            prefer_generic_function_type_aliases: true
            prefer_if_null_operators: true
            prefer_is_empty: true
            prefer_is_not_empty: true
            prefer_iterable_whereType: true
            prefer_single_quotes: true
            prefer_spread_collections: true
            recursive_getters: true
            slash_for_doc_comments: true
            type_init_formals: true
            unawaited_futures: true
            unnecessary_const: true
            unnecessary_new: true
            unnecessary_null_in_if_null_operators: true
            unnecessary_this: true
            unrelated_type_equality_checks: true
            use_function_type_syntax_for_parameters: true
            use_rethrow_when_possible: true

            # Effective_dart 1.2.0
            camel_case_types: true
            file_names: true
            non_constant_identifier_names: true
            constant_identifier_names: true
            directives_ordering: true
            implementation_imports: true
            prefer_interpolation_to_compose_strings: true
            unnecessary_brace_in_string_interps: true
            avoid_function_literals_in_foreach_calls: true
            prefer_function_declarations_over_variables: true
            unnecessary_lambdas: true
            unnecessary_getters_setters: true
            prefer_initializing_formals: true
            avoid_catches_without_on_clauses: true
            avoid_catching_errors: true
            use_to_and_as_if_applicable: true
            # avoid_classes_with_only_static_members: true
            prefer_mixin: true
            use_setters_to_change_properties: true
            avoid_setters_without_getters: true
            avoid_returning_this: true
            type_annotate_public_apis: true
            avoid_types_on_closure_parameters: true
            hash_and_equals: true
            avoid_equals_and_hash_code_on_mutable_classes: true
            avoid_dynamic_calls: true
            avoid_type_to_string: true
            deprecated_consistency: true
            eol_at_end_of_file: true
            noop_primitive_operations: true
            prefer_null_aware_method_calls: true
            use_test_throws_matchers: true
            unnecessary_late: true
            conditional_uri_does_not_exist: true
            #avoid_final_parameters: true
            no_leading_underscores_for_library_prefixes: true
            no_leading_underscores_for_local_identifiers: true
            secure_pubspec_urls: true

            # Dart 3.7-3.13, added 2026-09-19. The set had drifted 8 rules behind the
            # flutter_lints 6.0.0 baseline it claims to build on.
            strict_top_level_inference: true
            no_wildcard_variable_uses: true
            library_annotations: true
            unnecessary_library_name: true
            unnecessary_underscores: true
            use_null_aware_elements: true
            unintended_html_in_doc_comment: true
            invalid_runtime_check_with_js_interop_types: true

            # Wrong-code catchers
            async_return_with_no_await: true
            no_self_assignments: true
            switch_on_type: true
            unreachable_from_main: true
            deprecated_member_use_from_same_package: true
            matching_super_parameters: true
            # Withdrawn earlier as duplicating strict-casts/strict-raw-types; re-measured after the
            # stale `strict_raw_type: ignore` came out, and they cost 1 and 0 findings.
            no_dynamic_casts: true
            no_raw_types: true
            # Complements unawaited_futures, which only covers async functions: 36 fire-and-forget
            # calls in sync ones. The fix is an explicit `unawaited(...)`.
            discarded_futures: true
            missing_code_block_language_in_doc_comment: true

            # An `// ignore:` must say why, and must still apply. AGENTS.md asks for both.
            document_ignores: true
            unnecessary_ignore: true

            # Auto-fixable; `dart fix --apply` clears them
            no_literal_bool_comparisons: true
            unnecessary_breaks: true
            unnecessary_unawaited: true
            unnecessary_null_aware_operator_on_extension_on_nullable: true
            unnecessary_library_directive: true
            use_truncating_division: true
            combinators_ordering: true
            simple_directive_paths: true
            simplify_variable_pattern: true
            empty_container_bodies: true

            # Primary constructors (Dart 3.13)
            unnecessary_primary_constructor_body: true
            # 315 hits across one app: it rewrites every constructor to the 3.13 spelling.
            unnecessary_type_name_in_constructor: false
            unnecessary_const_in_enum_constructor: true
            use_declaring_parameters: true
            initialize_in_field_declaration: true

            # Experimental
            use_late_for_private_fields_and_variables: true
            use_build_context_synchronously: true
            unnecessary_nullable_for_final_variable_declarations: true
            unnecessary_null_checks: true
            null_check_on_nullable_type_parameter: true
            cast_nullable_to_non_nullable: true

# `dcm:` is the current key; the template arrived with the legacy `dart_code_metrics:`, which
# DCM still reads but no longer documents.
dcm:
      formatter:
            indent: 0
      extends:
            # Built into the DCM binary, so this package still ships no dependencies.
            # Supplies the recommended metric set; only deltas are listed below.
            - metrics-recommended
            # extends:
            #   - package:dart_code_metrics_presets/all.yaml
            #   - package:dart_code_metrics_presets/pub.yaml
            #   - package:dart_code_metrics_presets/intl.yaml
            #   - package:dart_code_metrics_presets/flame.yaml
            #   - package:dart_code_metrics_presets/patrol.yaml
            #   - package:dart_code_metrics_presets/metrics_recommended.yaml

      metrics:
            # A MAP, not a list. A list silently drops scalar entries, which left 21 of these 22
            # thresholds inert from 1.0.1 until 2026-09-19.
            cyclomatic-complexity: 20 # preset: 15
            number-of-parameters: 4 # preset: 6
            number-of-used-widgets: 10 # preset: 20
            widgets-nesting-level: 10 # preset: 8
            source-lines-of-code: 50 # preset: 60

            # 0..1 scale and higher is better, so the threshold is a minimum. DCM 1.35 moved
            # maintainability-index onto that scale; the old value 50 would flag every unit.
            maintainability-index: 0.4
            # Not in metrics-recommended and noisy (37 and 54 units), but no gate reads metrics —
            # they are signal for `make stats`, so they stay.
            tight-class-cohesion: 0.3
            weight-of-class: 0.33

            technical-debt:
                  threshold: 1
                  todo-cost: 161
                  ignore-cost: 320
                  ignore-for-file-cost: 396
                  as-dynamic-cost: 322
                  deprecated-annotations-cost: 37
                  file-nullsafety-migration-cost: 41
                  unit-type: "USD"

      metrics-exclude:
            - test/**

      rules:
            # https://dcm.dev/docs/rules/
            # - arguments-ordering:
            #    child-last: true
            - avoid-accessing-collections-by-constant-index
            - avoid-accessing-other-classes-private-members
            # - avoid-adjacent-strings
            - avoid-assigning-to-static-field
            - avoid-assignments-as-conditions
            # - avoid-async-call-in-sync-function
            # - avoid-banned-annotations
            # - avoid-banned-file-names
            # - avoid-banned-imports
            # - avoid-banned-types
            # - avoid-barrel-files
            - avoid-bitwise-operators-with-booleans
            - avoid-bottom-type-in-patterns
            - avoid-bottom-type-in-records
            - avoid-cascade-after-if-null
            - avoid-casting-to-extension-type
            - avoid-collapsible-if
            - avoid-collection-equality-checks
            - avoid-collection-methods-with-unrelated-types
            - avoid-collection-mutating-methods:
                    ignore-local: true
                    # Without this, every `_field.add(x)` on an owned collection is a hit (112 of 125).
                    ignore-private: true
            # - avoid-commented-out-code:
            #     min-lines: 1
            # - avoid-complex-arithmetic-expressions:
            #     max-number: 3
            # - avoid-complex-loop-conditions
            - avoid-conditions-with-boolean-literals
            - avoid-constant-assert-conditions
            - avoid-constant-conditions
            - avoid-constant-switches
            # - avoid-continue
            - avoid-contradictory-expressions
            # - avoid-declaring-call-method
            - avoid-default-tostring
            - avoid-deprecated-usage
            - avoid-double-slash-imports
            - avoid-duplicate-cascades:
                    exclude:
                          - test/**
                          - integration_test/**
            - avoid-duplicate-collection-elements
            # - avoid-duplicate-constant-values: #
            #     allowed: [0, 1, "value"]
            - avoid-duplicate-exports
            - avoid-duplicate-initializers
            - avoid-duplicate-map-keys
            - avoid-duplicate-mixins
            - avoid-duplicate-named-imports
            - avoid-duplicate-patterns
            - avoid-duplicate-switch-case-conditions
            - avoid-duplicate-test-assertions
            - avoid-dynamic:
                    severity: error
            - avoid-empty-spread
            - avoid-empty-test-groups
            - avoid-enum-values-by-index
            - avoid-equal-expressions
            - avoid-excessive-expressions
            - avoid-explicit-pattern-field-name
            # - avoid-explicit-type-declaration #
            # - avoid-extensions-on-records
            - avoid-function-type-in-records
            # `.ignore()` is `then(_ignore, onError: _ignore)`: the error never reaches the zone,
            # so it never reaches Sentry. `unawaited(...)` also says 'not awaited' but still reports.
            - avoid-future-ignore
            - avoid-future-tostring
            - avoid-generics-shadowing
            - avoid-getter-prefix:
                    prefix: "^get"
            - avoid-global-state:
                    severity: error
            - avoid-high-cyclomatic-complexity
            - avoid-identical-exception-handling-blocks
            - avoid-if-with-many-branches:
                    max-number: 5
            # - avoid-ignoring-return-values
            - avoid-implicitly-nullable-extension-types
            - avoid-importing-entrypoint-exports
            - avoid-inconsistent-digit-separators
            - avoid-incorrect-uri
            # - avoid-inferrable-type-arguments
            - avoid-inverted-boolean-checks
            - avoid-keywords-in-wildcard-pattern
            - avoid-late-final-reassignment
            # - avoid-late-keyword
            # - avoid-local-functions
            - avoid-long-functions:
                    # The real instrument is the `source-lines-of-code: 50` metric, which counts source
                    # lines rather than comments. This is the backstop against the absurd; `build` is
                    # long by nature, hence the exception.
                    max-length: 300
                    ignored-names:
                          - build
            - avoid-long-files:
                    max-length: 500
            - avoid-long-parameter-list:
                    ignore-optional: true
                    max-number: 7
                    ignored-names:
                          - copyWith
            - avoid-long-records:
                    max-number: 7
            - avoid-map-keys-contains:
                  severity: error
            - avoid-missed-calls
            - avoid-missing-completer-stack-trace
            - avoid-missing-enum-constant-in-map:
                    severity: error
            - avoid-missing-interpolation
            # - avoid-missing-test-files
            - avoid-misused-test-matchers
            - avoid-misused-set-literals
            - avoid-misused-wildcard-pattern
            - avoid-mixing-named-and-positional-fields
            - avoid-multi-assignment
            - avoid-mutating-parameters
            - avoid-negated-conditions
            - avoid-negations-in-equality-checks
            - avoid-nested-assignments:
                    ignore-null-aware-assignments: true
            - avoid-nested-conditional-expressions:
                    acceptable-level: 3 #
            - avoid-nested-extension-types:
                    acceptable-level: 2
            - avoid-nested-futures
            - avoid-nested-records:
                    acceptable-level: 1
            - avoid-nested-streams-and-futures
            - avoid-nested-switch-expressions:
                    acceptable-level: 5
            - avoid-nested-switches
            - avoid-nested-try-statements
            - avoid-never-passed-parameters
            # - avoid-non-ascii-symbols:
            #     ignored-invocations:
            #       - print
            #       - debugPrint
            #       - _log
            # - avoid-non-empty-constructor-bodies
            - avoid-non-final-exception-class-fields
            - avoid-non-null-assertion:
                    skip-checked-fields: true
                    exclude:
                          - test/**
                          - integration_test/**
                          - tool/**
            - avoid-not-encodable-in-to-json
            - avoid-nullable-interpolation
            - avoid-nullable-parameters-with-default-values
            - avoid-nullable-tostring
            - avoid-one-field-records
            - avoid-only-rethrow
            - avoid-passing-async-when-sync-expected
            # - avoid-passing-default-values
            - avoid-passing-self-as-argument
            # - avoid-positional-record-field-access #
            - avoid-recursive-calls
            - avoid-recursive-tostring
            - avoid-redundant-async
            - avoid-redundant-else
            # - avoid-redundant-positional-field-name
            - avoid-redundant-pragma-inline
            - avoid-referencing-discarded-variables
            # - avoid-referencing-subclasses #
            - avoid-renaming-representation-getters
            # - avoid-returning-cascades
            # - avoid-returning-void
            - avoid-self-assignment
            - avoid-self-compare
            - avoid-shadowed-extension-methods
            - avoid-shadowing:
                    ignore-parameters: true
                    ignored-names:
                          - context
            # - avoid-similar-names
            - avoid-single-field-destructuring
            # Error-class by consequence, but 1 findings stand in the line today;
            # raise to `severity: error` once they are cleared.
            - avoid-slow-collection-methods
            - avoid-stream-tostring
            - avoid-substring
            - avoid-suspicious-global-reference
            - avoid-suspicious-super-overrides
            - avoid-throw-in-catch-block
            - avoid-throw-objects-without-tostring
            - avoid-top-level-members-in-tests
            # - avoid-type-casts # TODO
            - avoid-unassigned-late-fields
            # Error-class by consequence, but 7 findings stand in the line today;
            # raise to `severity: error` once they are cleared.
            - avoid-unassigned-stream-subscriptions
            - avoid-uncaught-future-errors
            - avoid-unconditional-break
            - avoid-unknown-pragma
            - avoid-unnecessary-block
            - avoid-unnecessary-call
            - avoid-unnecessary-collections
            - avoid-unnecessary-compare-to
            - avoid-unnecessary-conditionals
            - avoid-unnecessary-constructor
            - avoid-unnecessary-continue
            - avoid-unnecessary-digit-separators
            - avoid-unnecessary-enum-arguments
            - avoid-unnecessary-enum-prefix
            - avoid-unnecessary-extends
            - avoid-unnecessary-futures
            - avoid-unnecessary-getter
            - avoid-unnecessary-if
            - avoid-unnecessary-late-fields
            - avoid-unnecessary-length-check
            - avoid-unnecessary-local-late
            - avoid-unnecessary-local-variable
            - avoid-unnecessary-negations
            - avoid-unnecessary-null-aware-elements
            - avoid-unnecessary-nullable-fields
            - avoid-unnecessary-nullable-parameters
            - avoid-unnecessary-nullable-return-type
            - avoid-unnecessary-overrides
            - avoid-unnecessary-patterns
            - avoid-unnecessary-reassignment
            - avoid-unnecessary-return
